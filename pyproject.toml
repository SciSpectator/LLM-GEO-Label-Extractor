[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-geo-label-extractor"
version = "2.1.0"
description = "Context-aware extraction and controlled-vocabulary normalization of GEO sample metadata"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26,<3",
  "requests>=2.31,<3",
  "sentence-transformers>=3.0,<6",
  "torch>=2.2",
  "transformers>=4.45,<6",
]

[project.scripts]
geo-label-extractor = "geo_label_extractor.geo_pipeline:main"
geo-label-gui = "geo_label_extractor.gui:main"

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
